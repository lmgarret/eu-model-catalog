# One file per AI lab: labs/<lab>.yaml. The key matches models.dev's lab id where it has one.
#
# aliases: other prefixes meaning this lab in model ids (Hugging Face orgs...), case-insensitive.
# models: keyed by the lab's canonical slug, lowercase. Hosted models resolve to <lab>/<slug>
#   through, in order: overlay `canonical`, models.dev's canonical_model_id, the host being the
#   lab (providers.yaml `lab`), an <org>/<name> model id, then a slug only one lab lists. Model
#   keys and `aliases` are matched case-insensitively; quantization suffixes (-FP8...) are ignored.
#   - license / open_weights: the weights' license; `hf` (Hugging Face repo) is checked at build time.
#   - source / checked: where the facts come from and when they were last verified.
#
# Mistral models are keyed by their API id; aliases list the other API ids Mistral's model cards
# give for the same model (e.g. -latest), plus models.dev and Hugging Face names.

name: Mistral AI
country: FR
website: https://mistral.ai
logo: mistral
color: '#fa520f'
aliases: [mistralai]
eu_ai_act:
  value: signatory
  source: https://digital-strategy.ec.europa.eu/en/policies/contents-code-gpai
  checked: 2026-10-22

