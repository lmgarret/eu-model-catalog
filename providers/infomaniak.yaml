# Infomaniak facts. Mostly Infomaniak's own claims, not verified. See src/facts.ts for the schema.
name: Infomaniak
website: https://www.infomaniak.com
logo: infomaniak
color: "#0098ff"

privacy:
  retention:
    value: { days: 0 }
    note: Prompts and outputs are only kept temporarily while the request is processed. Billing and operational metadata (client ID, request counts, timestamps, sizes) is kept.
    source: https://welcome.infomaniak.com/api/web-components/1/cgu/latest?id=87&locale=en_GB
    checked: 2026-10-22
  zero_data_retention:
    value: default
    note: Stated in the LLM API special conditions (Art. 6), review of 07/10/2025.
    source: https://welcome.infomaniak.com/api/web-components/1/cgu/latest?id=87&locale=en_GB
    checked: 2026-10-22
  training:
    value: never
    note: The terms state that prompts and responses are not used to train its own AIs or exploited in any other way.
    source: https://welcome.infomaniak.com/api/web-components/1/cgu/latest?id=87&locale=en_GB
    checked: 2026-10-22
  dpa:
    value: { available: true }
    note: Generic DPA covering all services. Sub-processors are listed in a "Third-Party Subcontractors" annex, and no public list URL was found.
    source: https://www.infomaniak.com/documents/privacy/DPA/Data_Processing_Agreement_(DPA).pdf
    checked: 2026-10-22

jurisdiction:
  regions:
    value:
      - { country: CH, city: Geneva }
    note: The page says the AI runs in Swiss data centers whose heat warms 6,000 homes. That is the D4 data center in Geneva (Plan-les-Ouates), per d4project.org.
    source: https://www.infomaniak.com/en/hosting/ai-services
    checked: 2026-10-22
  legal_entity:
    value: { name: Infomaniak Network SA, country: CH }
    note: Rue Eugène-Marziano 25, 1227 Les Acacias (Geneva).
    source: https://welcome.infomaniak.com/api/web-components/1/cgu/latest?id=87&locale=en_GB
    checked: 2026-10-22
  parent_company:
    value: { name: Infomaniak SA, country: CH, us_cloud_act: false }
    note: Swiss company listed on the SIX Swiss Exchange (ticker INFO) since October 2026, after a reverse takeover with Perrot Duval Holding. No external capital before that.
    source: https://www.infomaniak.com/en/investors
    checked: 2026-10-22
  certifications:
    value: [ISO27001, ISO9001, ISO14001, ISO50001]
    note: Also B Corp certified (2025) and holds the Swiss Hosting and Swiss Made Software labels.
    source: https://www.infomaniak.com/en/certifications
    checked: 2026-10-22

sustainability:
  renewable_energy:
    value: { share: 100, backing: mixed }
    note: 2024 mix of 38% Naturemade Star certified green power, 56% TÜV SÜD EE01 certified hydro and 6% self-generated solar. The goal is 50% self-generated by 2030.
    source: https://www.infomaniak.com/en/impact-report
    checked: 2026-10-22
  pue:
    value: 1.085
    note: 2024 annual average across all Infomaniak data centers. Live PUE for the D4 (AI) data center is published on d4project.org.
    source: https://www.infomaniak.com/en/impact-report
    checked: 2026-10-22
  heat_reuse:
    value: true
    note: AI infrastructure heat is fed into Geneva's district heating (up to 6,000 homes). Infomaniak reports that about 65% of D4's energy was recovered in 2024 while the network ramped up.
    source: https://www.infomaniak.com/en/hosting/ai-services
    checked: 2026-10-22

operations:
  sla:
    value: { uptime: 99.9 }
    note: Service availability commitment in the LLM API special conditions (Art. 5). Models marked beta are excluded.
    source: https://welcome.infomaniak.com/api/web-components/1/cgu/latest?id=87&locale=en_GB
    checked: 2026-10-22
  status_page: https://infomaniakstatus.com/en/
  openai_compatible:
    value: true
    source: https://www.infomaniak.com/en/hosting/ai-services
    checked: 2026-10-22
  billing:
    value:
      currency: CHF
      entity: Infomaniak Network SA
      minimum_commitment: none (pay as you go, 1M free credits to start)
    note: Billed monthly on tokens consumed, excluding VAT. A payment card is required at sign-up. The billing entity is taken from the LLM API terms.
    source: https://www.infomaniak.com/en/hosting/ai-services/prices
    checked: 2026-10-22

# The API is already at maximum privacy by default (no prompt storage, no training, Swiss-only).
# Beta models only differ on availability and lifecycle (LLM API terms, Art. 5), not on data handling, so no step for them.
privacy_setup:
  - id: use_api_not_web_app
    title: Call the models through the API, not the AI Services web app
    how: The AI Services web app keeps generated images in its history for 30 days, while API calls only log technical metadata and not the responses. Send requests with an API token instead of using the web app.
    access: self_serve
    source: https://www.infomaniak.com/en/support/faq/1632/generate-images-with-ai-services
    checked: 2026-10-22
  - id: generate_dpa
    title: Generate your customised DPA in the Manager
    how: The DPA already forms part of the general terms, so you have nothing to sign. For a copy for your records, an owner or administrator of the Organization clicks Generate in the Manager's DPA section to download a customised PDF.
    access: self_serve
    source: https://www.infomaniak.com/en/support/faq/2820/understanding-data-security-lpd-and-gdpr
    checked: 2026-10-22
  - id: request_subprocessor_annex
    title: Ask support for the sub-processor annex
    how: The public DPA does not include the "Third-Party Subcontractors" annex that the privacy policy refers to, and the DPA says more information is available on request to support. You have 30 days to object in writing to a new sub-processor, and an email is enough.
    access: on_request
    source: https://www.infomaniak.com/documents/privacy/DPA/Data_Processing_Agreement_(DPA).pdf
    checked: 2026-10-22
